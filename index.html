<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نجوم القواعد</title>
    <style>
        :root {
            --surface: #16162a;
            --card: #1e1d3a;
            --border: rgba(255,255,255,0.06);
            --text: #f0eaff;
            --dim: #9892b8;
            --gold: #f2c94c;
            --purple: #c084fc;
            --correct: #4ade80;
            --wrong: #fb7185;
            --radius: 14px;
            --container-max: 920px;
            --container-min: 320px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        html, body { height: 100%; overflow-x: hidden; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font);
            background: #0e0d1a;
            min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center;
            padding: 12px; color: var(--text);
        }

        /* ===== الهيدر ===== */
        .app-header {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 14px; margin-bottom: 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            width: 100%; max-width: var(--container-max); min-width: var(--container-min);
        }
        .app-logo { height: 34px; width: auto; border-radius: 50%; }
        .app-title {
            font-size: 1.1rem; font-weight: 800; flex: 1; text-align: center;
            background: linear-gradient(135deg, var(--gold), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== الحاوية ===== */
        .container {
            width: 100%; max-width: var(--container-max); min-width: var(--container-min);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px 16px 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            text-align: center; position: relative;
            transition: background 0.25s, border-color 0.25s;
            margin-bottom: 14px;
        }
        .container.correct-bg { background: #1a2e24; border-color: rgba(74,222,128,0.2); }
        .container.wrong-bg { background: #2e1a1e; border-color: rgba(251,113,133,0.2); animation: shake 0.3s ease-in-out; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-2px); }
        }

        .page-title {
            font-size: 1.25rem; font-weight: 700; margin-bottom: 2px;
            background: linear-gradient(135deg, var(--gold), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-sub { font-size: 0.8rem; color: var(--dim); margin-bottom: 14px; }

        /* ===== أزرار الفئات ===== */
        .card-grid {
            display: flex; flex-direction: column; gap: 10px;
            margin: 10px 0;
        }
        @media (min-width: 600px) {
            .card-grid { flex-direction: row; flex-wrap: wrap; gap: 12px; }
            .card-btn { width: calc(50% - 6px); }
        }
        .card-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 16px;
            border-radius: var(--radius);
            font-size: 1.02rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
            text-align: center;
            line-height: 1.5;
            width: 100%;
        }
        .card-btn:active { transform: scale(0.98); background: rgba(255,255,255,0.06); border-color: var(--gold); }
        .card-btn .icon { font-size: 1.6rem; display: inline-block; margin-left: 8px; vertical-align: middle; }
        .card-btn small { display: block; font-size: 0.72rem; font-weight: 400; color: var(--dim); margin-top: 2px; }

        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            -webkit-user-select: none; user-select: none;
        }
        .back-btn:active { background: rgba(255,255,255,0.1); transform: scale(0.96); }

        /* ===== شريط اللعب ===== */
        .game-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 40px; margin-bottom: 12px;
            border: 1px solid var(--border);
            font-size: 0.8rem; gap: 4px;
            min-height: 40px;
        }
        .game-bar .score { color: var(--gold); font-weight: 700; }
        .game-bar .lives { color: var(--wrong); font-weight: 600; letter-spacing: 1px; }
        .game-bar .streak { color: var(--correct); font-weight: 600; }
        .game-bar .timer { font-weight: 700; font-size: 0.85rem; min-width: 36px; }

        .cat-tag {
            display: inline-block;
            background: rgba(192,132,252,0.1);
            color: var(--purple);
            padding: 4px 14px; border-radius: 30px;
            font-size: 0.72rem; font-weight: 600; margin-bottom: 4px;
        }

        .progress-wrap {
            width: 100%; height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px; margin-bottom: 14px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 4px; transition: width 0.4s ease;
            background: linear-gradient(90deg, var(--gold), var(--purple));
        }

        .question-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 14px; margin-bottom: 14px;
            font-size: 1.15rem; font-weight: 600; line-height: 1.6;
            word-break: break-word;
        }

        /* ===== الخيارات ===== */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 10px;
        }
        @media (max-width: 520px) {
            .options { grid-template-columns: 1fr; }
        }
        @media (min-width: 900px) {
            .options { grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 14px; }
            .container { padding: 28px 24px 32px; }
        }

        .option-btn {
            background: rgba(255,255,255,0.04);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px 8px;
            font-size: 1rem; font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            word-break: break-word; line-height: 1.4;
            -webkit-user-select: none; user-select: none;
        }
        .option-btn:active:not(:disabled) { transform: scale(0.97); background: rgba(255,255,255,0.08); }
        .option-btn.correct-flash {
            background: rgba(74,222,128,0.12) !important;
            border-color: var(--correct) !important;
            box-shadow: 0 0 16px rgba(74,222,128,0.12);
            transform: scale(1.02);
        }
        .option-btn.wrong-flash {
            background: rgba(251,113,133,0.12) !important;
            border-color: var(--wrong) !important;
            box-shadow: 0 0 16px rgba(251,113,133,0.12);
            transform: scale(0.97);
        }
        .option-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        .hint-btn {
            background: rgba(251,191,36,0.06);
            border: 1px solid rgba(251,191,36,0.15);
            color: var(--gold);
            padding: 6px 16px; border-radius: 30px;
            font-size: 0.8rem; font-weight: 600; cursor: pointer;
            margin: 0 auto 10px; display: inline-block; transition: 0.15s;
        }
        .hint-btn:active { background: rgba(251,191,36,0.12); }

        .explanation-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(242,201,76,0.1);
            border-radius: var(--radius);
            padding: 10px 14px;
            margin: 8px 0 2px;
            font-size: 0.9rem; color: var(--dim);
            display: none; animation: fadeIn 0.25s;
            text-align: right; line-height: 1.6;
        }
        .rule-box {
            display: none;
            background: rgba(192,132,252,0.04);
            border: 1px solid rgba(192,132,252,0.1);
            border-radius: var(--radius);
            padding: 10px 14px; margin-top: 8px;
            font-size: 0.85rem; color: var(--dim);
            line-height: 1.7; text-align: right;
            animation: fadeIn 0.25s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .action-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

        /* ===== مقدمة المجموعة ===== */
        .group-intro {
            text-align: center; padding: 28px 16px;
            border: 1px dashed rgba(255,255,255,0.08);
            border-radius: var(--radius); margin: 14px 0;
        }
        .group-intro .gi-icon { font-size: 2.2rem; margin-bottom: 6px; }
        .group-intro .gi-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 2px; }
        .group-intro .gi-count { font-size: 0.85rem; color: var(--dim); }

        .start-btn {
            background: linear-gradient(135deg, var(--gold), #d4a800);
            color: #0e0d1a;
            border: none; padding: 12px 40px; font-size: 1rem;
            font-weight: 700; border-radius: 50px; cursor: pointer;
            transition: 0.15s; margin-top: 10px;
        }
        .start-btn:active { transform: scale(0.96); }

        /* ===== نافذة منبثقة ===== */
        .popup-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; visibility: hidden; opacity: 0;
            transition: 0.2s;
        }
        .popup-overlay.active { visibility: visible; opacity: 1; }
        .popup-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 380px; width: 88%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: pop 0.2s ease;
        }
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup-card p { font-size: 0.95rem; color: var(--text); margin-bottom: 14px; line-height: 1.6; }
        .popup-btn {
            background: linear-gradient(135deg, var(--gold), #d4a800);
            color: #0e0d1a;
            border: none; padding: 10px 32px;
            font-size: 0.95rem; font-weight: 700;
            border-radius: 50px; cursor: pointer; transition: 0.15s;
        }
        .popup-btn:active { transform: scale(0.96); }

        /* ===== النتائج ===== */
        .result-bar {
            display: flex; justify-content: center; gap: 12px;
            flex-wrap: wrap; margin: 14px 0;
        }
        .result-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px; min-width: 80px; flex: 1;
        }
        .result-item .ri-label { font-size: 0.65rem; color: var(--dim); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
        .result-item .ri-value { font-size: 1.2rem; font-weight: 700; }

        .rules-list { text-align: right; margin: 10px 0; }
        .rules-list li {
            list-style: none; padding: 5px 0;
            font-size: 0.85rem; color: var(--dim);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .rules-list li::before { content: '▸ '; color: var(--gold); font-weight: bold; }

        .music-toggle {
            position: absolute; top: 10px; right: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 50%; width: 32px; height: 32px;
            font-size: 0.9rem; cursor: pointer; transition: 0.15s;
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .music-toggle:active { background: rgba(255,255,255,0.1); }

        .star {
            position: fixed; pointer-events: none; z-index: 1000;
            font-size: 1.4rem;
            animation: starFall 0.6s ease-out forwards;
            color: var(--gold);
        }
        @keyframes starFall {
            0% { opacity:1; transform: translate(0,0) scale(1) rotate(0deg); }
            100% { opacity:0; transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg); }
        }

        #countdown {
            font-size: 2.6rem; font-weight: 700; margin-top: 12px;
            color: var(--gold);
        }
    </style>
</head>
<body>
    <header class="app-header">
        <img src="logo.png" alt="شعار نجوم القواعد" class="app-logo">
        <h1 class="app-title">نجوم القواعد</h1>
        <button class="music-toggle" id="musicToggle" aria-label="تفعيل/إيقاف الموسيقى">🎵</button>
    </header>

    <div class="container" id="quizContainer">
    </div>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-card">
            <p id="popupMessage"></p>
            <button class="popup-btn" id="popupNextBtn">التالي →</button>
        </div>
    </div>

    <script>
        (function() {
            // ===== حالة اللعبة =====
            let allQuestions = {};
            let currentCategory = null;
            let questions = [];
            let currentIndex = 0;
            let musicEnabled = true;
            let backgroundGainNode = null;
            let audioCtx = null;
            let currentRule = '';
            let timerId = null;
            let timeLeft = 0;
            let score = 0;
            let lives = 3;
            let streak = 0;
            let maxStreak = 0;
            let totalCorrect = 0;
            let totalWrong = 0;
            let groupResults = [];
            let currentGroupLabel = '';
            let groupCorrectCounter = 0;

            const container = document.getElementById('quizContainer');
            const popupOverlay = document.getElementById('popupOverlay');
            const popupMessage = document.getElementById('popupMessage');
            const popupNextBtn = document.getElementById('popupNextBtn');

            // ===== الصوت =====
            function initAudioContext() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (musicEnabled) startBackgroundMusic();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            function playCorrectSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.12); osc.stop(now + i * 0.12 + 0.3);
                });
            }
            function playWrongSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.value = 180;
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.4);
            }
            function startBackgroundMusic() {
                if (!audioCtx || backgroundGainNode) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                backgroundGainNode = audioCtx.createGain();
                backgroundGainNode.gain.value = 0.025;
                backgroundGainNode.connect(audioCtx.destination);
                function playLoop() {
                    if (!musicEnabled || !backgroundGainNode) return;
                    const t = audioCtx.currentTime;
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator(); const noteGain = audioCtx.createGain();
                        osc.type = 'sine'; osc.frequency.value = freq;
                        noteGain.gain.setValueAtTime(0.1, t + i * 0.7);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.7 + 0.6);
                        osc.connect(noteGain); noteGain.connect(backgroundGainNode);
                        osc.start(t + i * 0.7); osc.stop(t + i * 0.7 + 0.6);
                    });
                    setTimeout(() => { if (musicEnabled && backgroundGainNode) playLoop(); }, notes.length * 700 - 50);
                }
                playLoop();
            }
            function stopBackgroundMusic() { if (backgroundGainNode) { backgroundGainNode.disconnect(); backgroundGainNode = null; } }
            function toggleMusic() {
                musicEnabled = !musicEnabled;
                const btn = document.getElementById('musicToggle');
                if (btn) {
                    btn.textContent = musicEnabled ? '🎵' : '🔇';
                    btn.setAttribute('aria-pressed', musicEnabled ? 'true' : 'false');
                }
                if (musicEnabled) { initAudioContext(); if (!backgroundGainNode && audioCtx) startBackgroundMusic(); }
                else { stopBackgroundMusic(); }
            }

            function updateMusicToggle() {
                const btn = document.getElementById('musicToggle');
                if (btn) btn.textContent = musicEnabled ? '🎵' : '🔇';
            }

            // ===== تأثير =====
            function spawnStars(x, y, count = 10) {
                const emojis = ['✨', '⭐', '🌟', '💫'];
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    star.className = 'star'; star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    star.style.left = x + 'px'; star.style.top = y + 'px';
                    const angle = Math.random() * 2 * Math.PI;
                    const distance = 40 + Math.random() * 70;
                    star.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                    star.style.setProperty('--ty', Math.sin(angle) * distance - 30 + 'px');
                    document.body.appendChild(star);
                    star.addEventListener('animationend', () => star.remove());
                }
            }
            function getClickPos(e) {
                return { x: e.clientX || e.touches?.[0]?.clientX || window.innerWidth/2, y: e.clientY || e.touches?.[0]?.clientY || window.innerHeight/2 };
            }

            // ===== أيقونات الفئات =====
            const catIcons = { 'الإضافة': '🔗', 'الممنوع من الصرف': '🚫', 'الأسماء المشتقة': '📝', 'النداء': '📣', 'النعت': '🏷️' };

            // ===== الخلط =====
            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // ===== عرض الفئات =====
            function renderCategorySelection() {
                resetGame();
                container.innerHTML = '';
                updateMusicToggle();

                const title = document.createElement('div');
                title.className = 'page-title'; title.textContent = 'اختر فئة';
                container.appendChild(title);
                const sub = document.createElement('div');
                sub.className = 'page-sub'; sub.textContent = 'اختر باباً نحوياً لبدء التحدي';
                container.appendChild(sub);

                const grid = document.createElement('div');
                grid.className = 'card-grid';
                Object.keys(allQuestions).forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'card-btn';
                    const catData = allQuestions[cat];
                    const qs = catData.questions || catData;
                    btn.innerHTML = `<span class="icon">${catIcons[cat] || '📖'}</span>${cat}<small>${qs.length} سؤال</small>`;
                    btn.addEventListener('click', () => showRules(cat));
                    grid.appendChild(btn);
                });
                container.appendChild(grid);
            }

            function resetGame() {
                clearTimer();
                score = 0; lives = 3; streak = 0; maxStreak = 0;
                totalCorrect = 0; totalWrong = 0; groupResults = [];
                currentIndex = 0; questions = []; currentRule = '';
                // clear any transient state classes on the container
                if (container) container.classList.remove('wrong-bg', 'correct-bg');
            }

            // ===== شاشة القوانين =====
            function showRules(catName) {
                currentCategory = catName;
                const catData = allQuestions[catName];
                if (catData.questions) { currentRule = catData.rule || ''; }
                else { currentRule = ''; }
                resetGame();

                container.innerHTML = '';
                updateMusicToggle();

                const backRow = document.createElement('div');
                backRow.className = 'action-row';
                const backBtn = document.createElement('button');
                backBtn.className = 'back-btn'; backBtn.textContent = '🔙 الفئات';
                backBtn.addEventListener('click', renderCategorySelection);
                backRow.appendChild(backBtn);
                container.appendChild(backRow);

                const icon = catIcons[catName] || '📖';
                const title = document.createElement('div');
                title.className = 'page-title'; title.textContent = `${icon} ${catName}`;
                container.appendChild(title);

                const rulesDiv = document.createElement('div');
                rulesDiv.style.cssText = 'text-align:right; margin:12px 0; line-height:2;';
                const ul = document.createElement('ul');
                ul.className = 'rules-list';
                const rules = [
                    'تبدأ بــ 3 أرواح ❤️، تخسر روحاً عند كل إجابة خاطئة',
                    'كل إجابة صحيحة = +10 نقاط + نقاط إضافية حسب الضربات المتتالية',
                    'الضربات المتتالية تمنح نقاط مضاعفة: ×2 بعد 3، ×3 بعد 5',
                    'الأسئلة مقسمة إلى 3 مستويات: سهل 🟢 → متوسط 🟡 → صعب 🔴',
                    '✅ بعد كل مجموعة تظهر نتيجة المستوى',
                    'الهدف: إنهاء جميع المستويات بأعلى نقاط وأقل أخطاء'
                ];
                rules.forEach(r => {
                    const li = document.createElement('li');
                    li.textContent = r; ul.appendChild(li);
                });
                rulesDiv.appendChild(ul);
                container.appendChild(rulesDiv);

                if (currentRule) {
                    const ruleBox = document.createElement('div');
                    ruleBox.className = 'rule-box';
                    ruleBox.style.display = 'block';
                    ruleBox.innerHTML = `📜 <strong>القاعدة:</strong><br>${currentRule}`;
                    container.appendChild(ruleBox);
                }

                const startBtn = document.createElement('button');
                startBtn.className = 'start-btn';
                startBtn.textContent = '🚀 ابدأ التحدي';
                startBtn.addEventListener('click', () => startGame(catName));
                container.appendChild(startBtn);
            }

            // ===== بدء اللعبة =====
            function startGame(catName) {
                const catData = allQuestions[catName];
                let allQs;
                if (catData.questions) { allQs = catData.questions; currentRule = catData.rule || ''; }
                else { allQs = catData; currentRule = ''; }

                const levels = [
                    { key: 'سهل', min: 1, max: 3 },
                    { key: 'متوسط', min: 4, max: 6 },
                    { key: 'صعب', min: 7, max: 10 }
                ];
                questions = [];
                levels.forEach(({ key, min, max }) => {
                    const group = allQs.filter(q => q.difficulty >= min && q.difficulty <= max);
                    if (group.length) {
                        shuffle(group);
                        questions.push({ isHeader: true, label: key, count: group.length }, ...group);
                    }
                });
                currentIndex = 0;
                if (questions.length === 0) {
                    alert('لا توجد أسئلة في هذه الفئة');
                    renderCategorySelection();
                    return;
                }
                renderQuestion();
            }

            // ===== عرض السؤال =====
            function renderQuestion() {
                clearTimer();
                if (questions.length === 0 || currentIndex >= questions.length) {
                    showCompletion();
                    return;
                }
                // clear any transient state classes (in case of recent wrong/correct flash)
                if (container) container.classList.remove('wrong-bg', 'correct-bg');
                container.innerHTML = '';
                updateMusicToggle();

                // رأس المجموعة
                if (questions[currentIndex].isHeader) {
                    const header = questions[currentIndex];
                    // start tracking this group's results
                    currentGroupLabel = header.label || '';
                    groupCorrectCounter = 0;
                    const colors = { 'سهل': '#4ade80', 'متوسط': '#facc15', 'صعب': '#fb7185' };
                    const icons = { 'سهل': '🟢', 'متوسط': '🟡', 'صعب': '🔴' };
                    const hColor = colors[header.label] || '#fff';
                    const hIcon = icons[header.label] || '';

                    const gi = document.createElement('div');
                    gi.className = 'group-intro';
                    gi.style.borderColor = hColor + '33';
                    gi.style.background = hColor + '06';
                    gi.innerHTML = `<div class="gi-icon">${hIcon}</div>
                        <div class="gi-title" style="color:${hColor};">المستوى ${header.label}</div>
                        <div class="gi-count">${header.count} أسئلة</div>`;
                    container.appendChild(gi);

                    const cdDiv = document.createElement('div');
                    cdDiv.id = 'countdown';
                    cdDiv.style.cssText = 'font-size:3rem; font-weight:700; margin-top:14px; color:var(--gold);';
                    cdDiv.textContent = '3';
                    container.appendChild(cdDiv);

                    container.dataset.locked = 'true';
                    let sec = 3;
                    const interval = setInterval(() => {
                        sec--;
                        cdDiv.textContent = sec > 0 ? sec : '🚀';
                        if (sec <= 0) {
                            clearInterval(interval);
                            currentIndex++;
                            renderQuestion();
                        }
                    }, 1000);
                    return;
                }

                const q = questions[currentIndex];

                // ===== شريط اللعب =====
                const gameBar = document.createElement('div');
                gameBar.className = 'game-bar';
                const heartsStr = '❤️'.repeat(Math.max(0, lives)) + '🩶'.repeat(Math.max(0, 3 - lives));
                const streakStr = streak >= 2 ? ` 🔥${streak}` : '';
                gameBar.innerHTML = `
                    <span class="score">🏆 ${score}</span>
                    <span class="lives">${heartsStr}</span>
                    <span class="streak">${streakStr}</span>
                    <span class="timer" id="timerDisplay" style="font-weight:700;font-size:0.9rem;">⏱ 20</span>
                `;
                container.appendChild(gameBar);

                // start question timer
                startQuestionTimer();

                // ===== شريط التقدم =====
                const totalQs = questions.filter(x => !x.isHeader).length;
                const doneQs = questions.slice(0, currentIndex).filter(x => !x.isHeader).length;
                const pct = totalQs > 0 ? (doneQs / totalQs * 100) : 0;

                const pw = document.createElement('div');
                pw.className = 'progress-wrap';
                const pf = document.createElement('div');
                pf.className = 'progress-fill';
                pf.style.width = pct + '%';
                pw.appendChild(pf);
                container.appendChild(pw);

                const catTag = document.createElement('div');
                catTag.className = 'cat-tag';
                catTag.textContent = `${catIcons[currentCategory]} ${currentCategory} · السؤال ${doneQs + 1} من ${totalQs}`;
                container.appendChild(catTag);

                // ===== السؤال =====
                const qBox = document.createElement('div');
                qBox.className = 'question-box';
                qBox.textContent = q.question;
                container.appendChild(qBox);

                // ===== التلميح =====
                if (q.hint && q.hint.trim() !== '') {
                    const hintBtn = document.createElement('button');
                    hintBtn.className = 'hint-btn';
                    hintBtn.textContent = '💡 تلميح';
                    const hintDiv = document.createElement('div');
                    hintDiv.className = 'hint-text';
                    hintDiv.style.cssText = 'display:none; background:rgba(251,191,36,0.05); border:1px solid rgba(251,191,36,0.12); padding:8px 12px; border-radius:12px; margin-bottom:12px; color:var(--dim); text-align:right; font-size:0.9rem;';
                    hintDiv.textContent = q.hint;
                    hintBtn.addEventListener('click', () => {
                        hintDiv.style.display = hintDiv.style.display === 'none' ? 'block' : 'none';
                    });
                    container.appendChild(hintBtn);
                    container.appendChild(hintDiv);
                }

                // ===== الخيارات =====
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt.text;
                    btn.addEventListener('click', (e) => handleAnswer(idx, btn, e));
                    optionsDiv.appendChild(btn);
                });
                container.appendChild(optionsDiv);

                // ===== أزرار القاعدة والعودة =====
                const actionRow = document.createElement('div');
                actionRow.className = 'action-row';

                const ruleBtn = document.createElement('button');
                ruleBtn.className = 'back-btn';
                ruleBtn.style.cssText = 'border-color:rgba(242,201,76,0.25);color:var(--gold);';
                ruleBtn.innerHTML = '📖 القاعدة';
                ruleBtn.addEventListener('click', () => {
                    const rb = document.getElementById('ruleBox');
                    if (rb) rb.style.display = rb.style.display === 'none' ? 'block' : 'none';
                });
                actionRow.appendChild(ruleBtn);

                const quitBtn = document.createElement('button');
                quitBtn.className = 'back-btn';
                quitBtn.textContent = '🔙 خروج';
                quitBtn.addEventListener('click', () => {
                    resetGame(); renderCategorySelection();
                });
                actionRow.appendChild(quitBtn);

                container.appendChild(actionRow);

                // ===== صندوق القاعدة =====
                const ruleBox = document.createElement('div');
                ruleBox.className = 'rule-box'; ruleBox.id = 'ruleBox'; ruleBox.style.display = 'none';
                if (currentRule) { ruleBox.innerHTML = `📜 <strong>القاعدة:</strong><br>${currentRule}`; }
                else { ruleBox.textContent = 'لا توجد قاعدة مسجلة.'; }
                container.appendChild(ruleBox);

                // ===== التفسير =====
                const explLabel = document.createElement('div');
                explLabel.style.cssText = 'display:none; font-weight:600; color:var(--purple); margin-top:12px; margin-bottom:2px; text-align:right; font-size:0.95rem;';
                explLabel.id = 'explanationLabel'; explLabel.textContent = '💡 التفسير';
                container.appendChild(explLabel);

                const explBox = document.createElement('div');
                explBox.className = 'explanation-box'; explBox.id = 'explanationBox';
                container.appendChild(explBox);

                container.dataset.locked = 'false';
            }

            // ===== معالجة الإجابة =====
            function clearTimer() {
                if (timerId) { clearInterval(timerId); timerId = null; }
            }

            function startQuestionTimer() {
                if (timerId) { clearInterval(timerId); timerId = null; }
                timeLeft = 20;
                const td2 = document.getElementById('timerDisplay');
                if (td2) td2.textContent = `⏱ ${timeLeft}`;
                timerId = setInterval(() => {
                    timeLeft--;
                    const td = document.getElementById('timerDisplay');
                    if (td) {
                        td.textContent = `⏱ ${timeLeft}`;
                        td.style.color = timeLeft <= 5 ? '#fb7185' : timeLeft <= 10 ? '#facc15' : 'var(--text)';
                        if (timeLeft <= 5) td.style.animation = 'shake 0.2s ease-in-out';
                        else td.style.animation = '';
                    }
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerId = null;
                        handleTimeout();
                    }
                }, 1000);
            }

            function resumeTimer() {
                if (timerId) { clearInterval(timerId); timerId = null; }
                if (timeLeft <= 0) { handleTimeout(); return; }
                const td = document.getElementById('timerDisplay');
                if (td) {
                    td.textContent = `⏱ ${timeLeft}`;
                    td.style.color = timeLeft <= 5 ? '#fb7185' : timeLeft <= 10 ? '#facc15' : 'var(--text)';
                    if (timeLeft <= 5) td.style.animation = 'shake 0.2s ease-in-out';
                    else td.style.animation = '';
                }
                timerId = setInterval(() => {
                    timeLeft--;
                    const td2 = document.getElementById('timerDisplay');
                    if (td2) {
                        td2.textContent = `⏱ ${timeLeft}`;
                        td2.style.color = timeLeft <= 5 ? '#fb7185' : timeLeft <= 10 ? '#facc15' : 'var(--text)';
                        if (timeLeft <= 5) td2.style.animation = 'shake 0.2s ease-in-out';
                        else td2.style.animation = '';
                    }
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerId = null;
                        handleTimeout();
                    }
                }, 1000);
            }

            function handleAnswer(selectedIdx, btnElement, event) {
                if (container.dataset.locked === 'true') return;
                clearTimer();
                container.dataset.locked = 'true';

                const q = questions[currentIndex];
                const selectedOption = q.options[selectedIdx];
                const isCorrect = selectedOption.is_correct;
                const pos = getClickPos(event);
                initAudioContext();

                btnElement.classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');
                container.classList.add(isCorrect ? 'correct-bg' : 'wrong-bg');

                if (isCorrect) {
                    totalCorrect++;
                    // track per-group correct answers
                    groupCorrectCounter++;
                    streak++;
                    if (streak > maxStreak) maxStreak = streak;
                    let bonus = 0;
                    if (streak >= 5) bonus = 20;
                    else if (streak >= 3) bonus = 10;
                    const pts = 10 + bonus;
                    score += pts;
                    updateGameBar();
                    playCorrectSound();
                    spawnStars(pos.x, pos.y, 10);
                } else {
                    totalWrong++;
                    streak = 0;
                    lives--;
                    updateGameBar();
                    playWrongSound();
                }

                // التفسير
                const explBox = document.getElementById('explanationBox');
                const explLabel = document.getElementById('explanationLabel');
                if (explBox && selectedOption.explanation) {
                    explBox.textContent = selectedOption.explanation;
                    explBox.style.display = 'block';
                    if (explLabel) explLabel.style.display = 'block';
                } else {
                    if (explBox) explBox.style.display = 'none';
                    if (explLabel) explLabel.style.display = 'none';
                }

                disableOptions(true);

                if (isCorrect) {
                    const msg = selectedOption.explanation || '✅ إجابة صحيحة!';
                    showPopup(msg, () => {
                        btnElement.classList.remove('correct-flash');
                        container.classList.remove('correct-bg');
                        currentIndex++;
                        container.dataset.locked = 'false';

                        // تحقق من نهاية مجموعة
                        if (currentIndex < questions.length && questions[currentIndex].isHeader) {
                            saveGroupResult();
                        }
                        // تحقق من الخسارة
                        if (lives <= 0) {
                            showGameOver();
                            return;
                        }
                        renderQuestion();
                    });
                } else {
                    // incorrect answer: show feedback, deduct life and advance to next question
                    if (lives <= 0) {
                        setTimeout(() => { showGameOver(); }, 600);
                        return;
                    }
                    const msg = selectedOption.explanation || '❌ إجابة خاطئة';
                    showPopup(msg, () => {
                        btnElement.classList.remove('wrong-flash');
                        container.classList.remove('wrong-bg');
                        container.dataset.locked = 'false';

                        // leave this question in place; disable only the selected (wrong) option
                        container.querySelectorAll('.option-btn').forEach(b => {
                            if (b === btnElement) b.disabled = true;
                            else b.disabled = false;
                        });

                        // if no lives left, show game over
                        if (lives <= 0) { showGameOver(); return; }

                        // resume the timer from where it stopped
                        resumeTimer();
                    });
                }
            }

            function handleTimeout() {
                if (container.dataset.locked === 'true') return;
                container.dataset.locked = 'true';
                totalWrong++;
                streak = 0;
                lives--;
                container.classList.add('wrong-bg');
                const q = questions[currentIndex];
                if (q) {
                    const explBox = document.getElementById('explanationBox');
                    const explLabel = document.getElementById('explanationLabel');
                    if (explBox) {
                        explBox.textContent = '⏰ انتهى الوقت!';
                        explBox.style.display = 'block';
                        if (explLabel) explLabel.style.display = 'block';
                    }
                }
                disableOptions(true);
                updateGameBar();
                playWrongSound();
                if (lives <= 0) {
                    setTimeout(() => { showGameOver(); }, 700);
                    return;
                }

                // Show a popup and then restart the current question timer (like an incorrect answer)
                showPopup('⏰ انتهى الوقت!', () => {
                    container.classList.remove('wrong-bg');
                    container.dataset.locked = 'false';

                    // re-enable all options since none was picked
                    container.querySelectorAll('.option-btn').forEach(b => b.disabled = false);

                    // if no lives left, show game over
                    if (lives <= 0) { showGameOver(); return; }

                    // restart the timer for the same question
                    startQuestionTimer();
                });
            }

            function saveGroupResult() {
                // Called when moving into the next group's header. Use tracked counters.
                if (!currentGroupLabel) return;
                // avoid duplicate entries
                if (groupResults.length && groupResults[groupResults.length - 1].label === currentGroupLabel) return;
                groupResults.push({ label: currentGroupLabel, correct: groupCorrectCounter });
                // reset tracking until next header sets them
                currentGroupLabel = '';
                groupCorrectCounter = 0;
            }

            function finalizeGroupIfNeeded() {
                if (currentGroupLabel && (!groupResults.length || groupResults[groupResults.length - 1].label !== currentGroupLabel)) {
                    groupResults.push({ label: currentGroupLabel, correct: groupCorrectCounter });
                }
            }

            function updateGameBar() {
                const gb = container.querySelector('.game-bar');
                if (gb) {
                    const heartsStr = '❤️'.repeat(Math.max(0, lives)) + '🩶'.repeat(Math.max(0, 3 - lives));
                    const streakStr = streak >= 2 ? ` 🔥${streak}` : '';
                    const t = document.getElementById('timerDisplay');
                    const timerStr = t ? t.textContent : '⏱ 20';
                    gb.innerHTML = `
                        <span class="score">🏆 ${score}</span>
                        <span class="lives">${heartsStr}</span>
                        <span class="streak">${streakStr}</span>
                        <span class="timer" id="timerDisplay" style="font-weight:700;font-size:0.9rem;">${timerStr}</span>
                    `;
                }
            }

            function disableOptions(disable) {
                container.querySelectorAll('.option-btn').forEach(b => b.disabled = disable);
            }

            function showPopup(text, callback) {
                popupMessage.textContent = text;
                popupOverlay.classList.add('active');
                popupNextBtn.onclick = () => {
                    popupOverlay.classList.remove('active');
                    if (callback) callback();
                };
            }

            function generateGroupResultsHtml() {
                if (groupResults.length === 0) return '';
                let html = '<div style="width:100%; text-align:center; margin-top:10px;"><div style="font-size:0.9rem; color:var(--dim); margin-bottom:6px;">نتائج المستويات:</div><div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">';
                groupResults.forEach(gr => {
                    html += `<span style="background:rgba(255,255,255,0.05); padding:6px 12px; border-radius:20px; font-size:0.85rem;">${gr.label} ✅ ${gr.correct}</span>`;
                });
                html += '</div></div>';
                return html;
            }

            function showGameOver() {
                clearTimer();
                // remove transient classes before rendering end screen
                if (container) container.classList.remove('wrong-bg', 'correct-bg');
                container.innerHTML = '';
                updateMusicToggle();
                finalizeGroupIfNeeded();

                const title = document.createElement('div');
                title.className = 'page-title'; title.textContent = '💔 انتهت اللعبة';
                container.appendChild(title);
                const sub = document.createElement('div');
                sub.className = 'page-sub'; sub.textContent = 'نفدت أرواحك';
                container.appendChild(sub);

                const rb = document.createElement('div');
                rb.className = 'result-bar';
                rb.innerHTML = `
                    <div class="result-item"><div class="ri-label">النقاط</div><div class="ri-value" style="color:var(--gold);">${score}</div></div>
                    <div class="result-item"><div class="ri-label">✅ صحيح</div><div class="ri-value" style="color:var(--correct);">${totalCorrect}</div></div>
                    <div class="result-item"><div class="ri-label">❌ خطأ</div><div class="ri-value" style="color:var(--wrong);">${totalWrong}</div></div>
                    <div class="result-item"><div class="ri-label">🔥 أطول ضربة</div><div class="ri-value" style="color:var(--gold);">${maxStreak}</div></div>
                `;
                container.appendChild(rb);

                const ar = document.createElement('div');
                ar.className = 'action-row';
                const retry = document.createElement('button');
                retry.className = 'start-btn';
                retry.textContent = '🔄 حاول مرة أخرى';
                retry.addEventListener('click', () => { resetGame(); showRules(currentCategory); });
                ar.appendChild(retry);
                const back = document.createElement('button');
                back.className = 'back-btn';
                back.textContent = '🔙 الفئات';
                back.addEventListener('click', () => { resetGame(); renderCategorySelection(); });
                ar.appendChild(back);
                container.appendChild(ar);
            }

            // ===== الإكمال =====
            function showCompletion() {
                clearTimer();
                // remove transient classes before rendering completion screen
                if (container) container.classList.remove('wrong-bg', 'correct-bg');
                container.innerHTML = '';
                updateMusicToggle();
                finalizeGroupIfNeeded();

                const accuracy = totalCorrect + totalWrong > 0 ? Math.round(totalCorrect / (totalCorrect + totalWrong) * 100) : 0;
                const stars = accuracy >= 90 ? '⭐⭐⭐' : accuracy >= 70 ? '⭐⭐' : '⭐';

                const title = document.createElement('div');
                title.className = 'page-title';
                title.textContent = `🎉 أكملت "${currentCategory}"`;
                container.appendChild(title);
                const sub = document.createElement('div');
                sub.className = 'page-sub';
                sub.textContent = `${stars}  •  دقة ${accuracy}%`;
                container.appendChild(sub);

                const rb = document.createElement('div');
                rb.className = 'result-bar';
                rb.innerHTML = `
                    <div class="result-item"><div class="ri-label">النقاط</div><div class="ri-value" style="color:var(--gold);">${score}</div></div>
                    <div class="result-item"><div class="ri-label">✅ صحيح</div><div class="ri-value" style="color:var(--correct);">${totalCorrect}</div></div>
                    <div class="result-item"><div class="ri-label">❌ خطأ</div><div class="ri-value" style="color:var(--wrong);">${totalWrong}</div></div>
                    <div class="result-item"><div class="ri-label">🔥 أطول ضربة</div><div class="ri-value" style="color:var(--gold);">${maxStreak}</div></div>
                `;
                container.appendChild(rb);

                const ar = document.createElement('div');
                ar.className = 'action-row';
                const again = document.createElement('button');
                again.className = 'start-btn';
                again.textContent = '🔄 إعادة الفئة';
                again.addEventListener('click', () => { resetGame(); startGame(currentCategory); });
                ar.appendChild(again);
                const back = document.createElement('button');
                back.className = 'back-btn';
                back.textContent = '🔙 الفئات';
                back.addEventListener('click', () => { resetGame(); renderCategorySelection(); });
                ar.appendChild(back);
                container.appendChild(ar);
            }

            // ===== تحميل الأسئلة =====
            async function loadQuestions() {
                try {
                    const res = await fetch('./questions.json');
                    if (!res.ok) throw new Error('تعذر تحميل الملف');
                    const data = await res.json();
                    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('يجب أن يكون الملف كائناً');
                    for (const [cat, val] of Object.entries(data)) {
                        let arr;
                        if (val.questions) { arr = val.questions; }
                        else if (Array.isArray(val)) { arr = val; }
                        else { throw new Error(`الفئة ${cat} يجب أن تحتوي على مصفوفة questions`); }
                        if (!Array.isArray(arr)) throw new Error(`الفئة ${cat} ليست مصفوفة`);
                        arr.forEach((q, i) => {
                            if (!q.question || !Array.isArray(q.options) || q.options.length < 2) throw new Error(`السؤال ${i+1} في ${cat} غير مكتمل`);
                            q.options.forEach((opt, j) => {
                                if (!opt.text || typeof opt.is_correct !== 'boolean') throw new Error(`الخيار ${j+1} في السؤال ${i+1} (${cat}) ينقصه حقل`);
                            });
                        });
                    }
                    allQuestions = data;
                    renderCategorySelection();
                } catch (err) {
                    container.innerHTML = `<h2 style="color:var(--wrong);">⚠️ ${err.message}</h2>`;
                    console.error(err);
                }
            }

            document.body.addEventListener('click', initAudioContext, { once: true });
            document.body.addEventListener('touchstart', initAudioContext, { once: true });
            loadQuestions();
            window.toggleMusic = toggleMusic;
            // Attach header music toggle (persistent) and sync state
            const headerMusicBtn = document.getElementById('musicToggle');
            if (headerMusicBtn) {
                headerMusicBtn.addEventListener('click', toggleMusic);
                headerMusicBtn.textContent = musicEnabled ? '🎵' : '🔇';
                headerMusicBtn.setAttribute('aria-pressed', musicEnabled ? 'true' : 'false');
            }
        })();
    </script>
</body>
</html>
