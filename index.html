<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تفاعلي</title>
    <style>
        :root {
            --bg: #f9f5ff;
            --card: #ffffff;
            --text: #3e2a6e;
            --correct: #4caf93;
            --wrong: #e07a5f;
            --btn: #7c5dfa;
            --btn-hover: #6a4bdb;
            --gold: #f2c94c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-attachment: fixed;
            transition: background 0.6s;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card);
            border-radius: 35px;
            padding: 30px 25px 40px;
            box-shadow: 0 20px 40px rgba(62, 42, 110, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: background 0.4s;
        }

        .container.correct-bg {
            background: #e6ffed;
        }

        .container.wrong-bg {
            background: #fff0f0;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
        }

        .progress {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 20px;
            opacity: 0.8;
            font-weight: 500;
        }

        .question-box {
            background: #f3f0ff;
            border-radius: 25px;
            padding: 25px 20px;
            margin-bottom: 30px;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.5;
            word-break: break-word;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            .options {
                grid-template-columns: 1fr;
            }
            .question-box {
                font-size: 1.4rem;
            }
        }

        .option-btn {
            background: var(--btn);
            color: white;
            border: none;
            padding: 18px 10px;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #4e3aa5, 0 10px 20px rgba(0,0,0,0.1);
            transform: translateY(0);
            letter-spacing: 0.5px;
            word-break: break-word;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #4e3aa5, 0 12px 22px rgba(0,0,0,0.15);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #4e3aa5, 0 8px 15px rgba(0,0,0,0.1);
        }

        .option-btn.correct-flash {
            background: var(--correct) !important;
            box-shadow: 0 0 30px rgba(76, 175, 147, 0.7);
            transform: scale(1.05);
            transition: 0.15s;
        }

        .option-btn.wrong-flash {
            background: var(--wrong) !important;
            box-shadow: 0 0 25px rgba(224, 122, 95, 0.7);
            transform: scale(0.97);
            transition: 0.15s;
        }

        .option-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #4e3aa5;
        }

        /* تأثيرات النجوم */
        .star {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 2rem;
            animation: starFall 0.8s ease-out forwards;
            color: var(--gold);
        }

        @keyframes starFall {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg);
            }
        }

        .reset-btn {
            background: none;
            border: 2px solid var(--btn);
            color: var(--btn);
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: var(--btn);
            color: white;
        }

        .completion-msg {
            font-size: 2rem;
            font-weight: bold;
            color: var(--correct);
            margin: 30px 0;
        }

        .finish-stars {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 3rem;
        }

        /* موسيقى */
        .music-toggle {
            position: absolute;
            top: 15px;
            right: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container" id="quizContainer">
        <button class="music-toggle" id="musicToggle" title="تشغيل/إيقاف الموسيقى">🎵</button>
        <div class="progress" id="progressIndicator"></div>
        <div class="question-box" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <button class="reset-btn" id="resetBtn" style="display: none;">إعادة الاختبار</button>
        <div id="completionArea"></div>
    </div>

    <script>
        (function() {
            // ========== تحميل الأسئلة من JSON ==========
            let questions = [];
            let currentIndex = 0;
            let musicEnabled = true; // الافتراضي: موسيقى عاملة
            let backgroundGainNode = null;
            let audioCtx = null;

            // ========== الأصوات باستخدام Web Audio API ==========
            function initAudioContext() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    // إنشاء موسيقى الخلفية
                    if (musicEnabled) startBackgroundMusic();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playCorrectSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.3);
                });
            }

            function playWrongSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = 200;
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            function startBackgroundMusic() {
                if (!audioCtx || backgroundGainNode) return;
                // لحن بسيط متكرر (C major arpeggio) بمستوى صوت منخفض جدًا
                const now = audioCtx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25]; // C4 E4 G4 C5
                const loopDuration = notes.length * 0.7;
                backgroundGainNode = audioCtx.createGain();
                backgroundGainNode.gain.value = 0.04; // هادئ جدًا
                backgroundGainNode.connect(audioCtx.destination);

                function playLoop() {
                    if (!musicEnabled || !backgroundGainNode) return;
                    const t = audioCtx.currentTime;
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        noteGain.gain.setValueAtTime(0.15, t + i * 0.7);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.7 + 0.6);
                        osc.connect(noteGain);
                        noteGain.connect(backgroundGainNode);
                        osc.start(t + i * 0.7);
                        osc.stop(t + i * 0.7 + 0.6);
                    });
                    // تكرار بعد انتهاء المقطع
                    setTimeout(() => {
                        if (musicEnabled && backgroundGainNode) playLoop();
                    }, loopDuration * 1000 - 50);
                }
                playLoop();
            }

            function stopBackgroundMusic() {
                if (backgroundGainNode) {
                    backgroundGainNode.disconnect();
                    backgroundGainNode = null;
                }
            }

            // ========== تأثير النجوم ==========
            function spawnStars(x, y, count = 12) {
                const emojis = ['✨', '⭐', '🌟', '💫', '🎉'];
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    star.style.left = x + 'px';
                    star.style.top = y + 'px';
                    const angle = Math.random() * 2 * Math.PI;
                    const distance = 50 + Math.random() * 80;
                    star.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                    star.style.setProperty('--ty', Math.sin(angle) * distance - 30 + 'px');
                    document.body.appendChild(star);
                    star.addEventListener('animationend', () => star.remove());
                }
            }

            function getClickPosition(event) {
                return {
                    x: event.clientX || event.touches?.[0]?.clientX || window.innerWidth/2,
                    y: event.clientY || event.touches?.[0]?.clientY || window.innerHeight/2
                };
            }

            // ========== عرض السؤال ==========
            const container = document.getElementById('quizContainer');
            const questionEl = document.getElementById('questionText');
            const optionsEl = document.getElementById('optionsContainer');
            const progressEl = document.getElementById('progressIndicator');
            const resetBtn = document.getElementById('resetBtn');
            const completionArea = document.getElementById('completionArea');
            const musicToggle = document.getElementById('musicToggle');

            function renderQuestion() {
                if (!questions.length || currentIndex >= questions.length) {
                    showCompletion();
                    return;
                }
                const q = questions[currentIndex];
                questionEl.textContent = q.question;
                progressEl.textContent = `السؤال ${currentIndex + 1} من ${questions.length}`;
                optionsEl.innerHTML = '';
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.addEventListener('click', (e) => handleAnswer(idx, btn, e));
                    // لدعم اللمس نستخدم click
                    optionsEl.appendChild(btn);
                });
                container.classList.remove('correct-bg', 'wrong-bg');
            }

            function handleAnswer(selectedIdx, btnElement, event) {
                // منع الضغط المتعدد أثناء التأثير
                if (container.dataset.locked === 'true') return;
                container.dataset.locked = 'true';
                const q = questions[currentIndex];
                const isCorrect = (selectedIdx === q.correct);
                const pos = getClickPosition(event);

                initAudioContext(); // لضمان تشغيل الصوت بعد تفاعل المستخدم

                if (isCorrect) {
                    // تأثير أخضر
                    btnElement.classList.add('correct-flash');
                    container.classList.add('correct-bg');
                    playCorrectSound();
                    spawnStars(pos.x, pos.y, 15);
                    // تعطيل كل الأزرار مؤقتًا
                    disableAllOptions(true);
                    // انتقال للسؤال التالي بعد مهلة قصيرة
                    setTimeout(() => {
                        btnElement.classList.remove('correct-flash');
                        container.classList.remove('correct-bg');
                        currentIndex++;
                        container.dataset.locked = 'false';
                        renderQuestion();
                    }, 1200);
                } else {
                    // إجابة خاطئة
                    btnElement.classList.add('wrong-flash');
                    container.classList.add('wrong-bg');
                    playWrongSound();
                    // لا ننشئ نجوم، فقط رجّة خفيفة في الكارد
                    disableAllOptions(true);
                    setTimeout(() => {
                        btnElement.classList.remove('wrong-flash');
                        container.classList.remove('wrong-bg');
                        container.dataset.locked = 'false';
                        // إعادة تمكين الخيارات ليجرب مرة أخرى
                        disableAllOptions(false);
                    }, 700);
                }
            }

            function disableAllOptions(disable) {
                const allBtns = optionsEl.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = disable);
            }

            function showCompletion() {
                questionEl.textContent = '🎉 أحسنت! لقد أكملت جميع الأسئلة.';
                optionsEl.innerHTML = '';
                progressEl.textContent = '';
                completionArea.innerHTML = `
                    <div class="completion-msg">ممتاز!</div>
                    <div class="finish-stars">🌟🌟🌟🌟🌟</div>
                `;
                resetBtn.style.display = 'inline-block';
                container.dataset.locked = 'false';
            }

            function resetQuiz() {
                currentIndex = 0;
                resetBtn.style.display = 'none';
                completionArea.innerHTML = '';
                container.dataset.locked = 'false';
                renderQuestion();
            }

            resetBtn.addEventListener('click', resetQuiz);

            // ========== التحكم بالموسيقى ==========
            musicToggle.addEventListener('click', () => {
                musicEnabled = !musicEnabled;
                musicToggle.textContent = musicEnabled ? '🎵' : '🔇';
                if (musicEnabled) {
                    initAudioContext();
                    if (!backgroundGainNode && audioCtx) startBackgroundMusic();
                } else {
                    stopBackgroundMusic();
                }
            });

            // ========== جلب الأسئلة من ملف JSON ==========
            async function loadQuestions() {
                try {
                    const response = await fetch('./questions.json');
                    if (!response.ok) throw new Error('تعذر تحميل الأسئلة');
                    questions = await response.json();
                    if (!Array.isArray(questions) || questions.length === 0) {
                        throw new Error('الملف لا يحتوي على أسئلة صالحة');
                    }
                    // التحقق من أن كل سؤال يحتوي على الحقول المطلوبة
                    questions.forEach((q, i) => {
                        if (!q.question || !Array.isArray(q.options) || q.options.length !== 4 || typeof q.correct !== 'number' || q.correct < 0 || q.correct > 3) {
                            throw new Error(`السؤال رقم ${i+1} غير مكتمل`);
                        }
                    });
                    renderQuestion();
                } catch (error) {
                    questionEl.textContent = '⚠️ خطأ في تحميل الأسئلة. تأكد من وجود ملف questions.json صحيح.';
                    console.error(error);
                }
            }

            // بدء التطبيق
            loadQuestions();

            // تأكد من أن أول تفاعل يشغل الصوت (سياسات المتصفح)
            document.body.addEventListener('click', initAudioContext, { once: true });
            document.body.addEventListener('touchstart', initAudioContext, { once: true });
        })();
    </script>
</body>
</html>
