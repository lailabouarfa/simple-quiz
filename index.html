<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الأسئلة التفاعلي</title>
    <style>
        :root {
            --bg: #f9f5ff;
            --card: #ffffff;
            --text: #3e2a6e;
            --correct: #4caf93;
            --wrong: #e07a5f;
            --btn: #7c5dfa;
            --btn-hover: #6a4bdb;
            --gold: #f2c94c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            background-attachment: fixed;
            padding-top: 30px;
        }

        /* ========== الهيدر ========== */
        .app-header {
            background: #ffffffdd;
            backdrop-filter: blur(12px);
            border-radius: 0 0 30px 30px;
            padding: 10px 25px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 8px 25px rgba(62, 42, 110, 0.12);
            width: 100%;
            max-width: 750px;
            position: relative;
            z-index: 20;
        }

        .app-logo {
            height: 50px;
            width: auto;
            border-radius: 12px;
            transition: transform 0.3s;
        }

        .app-logo:hover {
            transform: rotate(-5deg) scale(1.1);
        }

        .app-title {
            font-size: 2rem;
            font-weight: 800;
            color: #3e2a6e;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #7c5dfa, #f2c94c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card);
            border-radius: 35px;
            padding: 30px 25px 40px;
            box-shadow: 0 20px 40px rgba(62, 42, 110, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: background 0.4s;
        }

        .container.correct-bg {
            background: #e6ffed;
        }

        .container.wrong-bg {
            background: #fff0f0;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
        }

        .progress {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 15px;
            opacity: 0.8;
            font-weight: 500;
        }

        .category-label {
            display: inline-block;
            background: #e8e0ff;
            color: #4a3a8a;
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question-box {
            background: #f3f0ff;
            border-radius: 25px;
            padding: 25px 20px;
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.5;
            word-break: break-word;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            .options {
                grid-template-columns: 1fr;
            }
            .question-box {
                font-size: 1.4rem;
            }
            .app-title {
                font-size: 1.5rem;
            }
            .app-logo {
                height: 40px;
            }
        }

        .option-btn {
            background: var(--btn);
            color: white;
            border: none;
            padding: 18px 10px;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #4e3aa5, 0 10px 20px rgba(0,0,0,0.1);
            transform: translateY(0);
            letter-spacing: 0.5px;
            word-break: break-word;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #4e3aa5, 0 12px 22px rgba(0,0,0,0.15);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #4e3aa5, 0 8px 15px rgba(0,0,0,0.1);
        }

        .option-btn.correct-flash {
            background: var(--correct) !important;
            box-shadow: 0 0 30px rgba(76, 175, 147, 0.7);
            transform: scale(1.05);
            transition: 0.15s;
        }

        .option-btn.wrong-flash {
            background: var(--wrong) !important;
            box-shadow: 0 0 25px rgba(224, 122, 95, 0.7);
            transform: scale(0.97);
            transition: 0.15s;
        }

        .option-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #4e3aa5;
        }

        .explanation-box {
            background: #fff9e6;
            border: 2px solid #ffe082;
            border-radius: 20px;
            padding: 15px 20px;
            margin: 15px 0 5px;
            font-size: 1.1rem;
            color: #5d4e37;
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hint-btn {
            background: #fff3e0;
            border: 2px solid #ffb74d;
            color: #e65100;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 0 auto 15px;
            display: inline-block;
            transition: 0.2s;
        }

        .hint-btn:hover {
            background: #ffe0b2;
        }

        .star {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 2rem;
            animation: starFall 0.8s ease-out forwards;
            color: var(--gold);
        }

        @keyframes starFall {
            0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg); }
        }

        .categories-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .category-btn {
            background: #ffffff;
            border: 3px solid var(--btn);
            color: var(--text);
            padding: 20px 25px;
            border-radius: 25px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 160px;
            box-shadow: 0 5px 15px rgba(124,93,250,0.1);
        }

        .category-btn:hover {
            background: var(--btn);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(124,93,250,0.3);
        }

        .back-btn, .reset-btn {
            background: none;
            border: 2px solid var(--btn);
            color: var(--btn);
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }

        .back-btn:hover, .reset-btn:hover {
            background: var(--btn);
            color: white;
        }

        .completion-msg {
            font-size: 2rem;
            font-weight: bold;
            color: var(--correct);
            margin: 30px 0 10px;
        }

        .finish-stars {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 3rem;
        }

        .music-toggle {
            position: absolute;
            top: 15px;
            right: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- الشريط العلوي الثابت -->
    <header class="app-header">
        <img src="logo.png" alt="شعار نجوم القواعد" class="app-logo">
        <h1 class="app-title">نجوم القواعد</h1>
    </header>

    <!-- باقي المحتوى التفاعلي -->
    <div class="container" id="quizContainer">
        <button class="music-toggle" id="musicToggle" title="تشغيل/إيقاف الموسيقى">🎵</button>
        <!-- المحتوى سيُحقن ديناميكيًا -->
    </div>

    <script>
        (function() {
            let allQuestions = {};
            let currentCategory = null;
            let questions = [];
            let currentIndex = 0;
            let musicEnabled = true;
            let backgroundGainNode = null;
            let audioCtx = null;

            const container = document.getElementById('quizContainer');

            // === Audio Logic ===
            function initAudioContext() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (musicEnabled) startBackgroundMusic();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playCorrectSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.3);
                });
            }

            function playWrongSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = 200;
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            function startBackgroundMusic() {
                if (!audioCtx || backgroundGainNode) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                backgroundGainNode = audioCtx.createGain();
                backgroundGainNode.gain.value = 0.04;
                backgroundGainNode.connect(audioCtx.destination);
                function playLoop() {
                    if (!musicEnabled || !backgroundGainNode) return;
                    const t = audioCtx.currentTime;
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        noteGain.gain.setValueAtTime(0.15, t + i * 0.7);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.7 + 0.6);
                        osc.connect(noteGain);
                        noteGain.connect(backgroundGainNode);
                        osc.start(t + i * 0.7);
                        osc.stop(t + i * 0.7 + 0.6);
                    });
                    setTimeout(() => { if (musicEnabled && backgroundGainNode) playLoop(); }, notes.length * 700 - 50);
                }
                playLoop();
            }

            function stopBackgroundMusic() {
                if (backgroundGainNode) { backgroundGainNode.disconnect(); backgroundGainNode = null; }
            }

            function toggleMusic() {
                musicEnabled = !musicEnabled;
                const btn = document.getElementById('musicToggle');
                if (btn) btn.textContent = musicEnabled ? '🎵' : '🔇';
                if (musicEnabled) {
                    initAudioContext();
                    if (!backgroundGainNode && audioCtx) startBackgroundMusic();
                } else {
                    stopBackgroundMusic();
                }
            }

            // === Stars ===
            function spawnStars(x, y, count = 12) {
                const emojis = ['✨', '⭐', '🌟', '💫', '🎉'];
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    star.style.left = x + 'px';
                    star.style.top = y + 'px';
                    const angle = Math.random() * 2 * Math.PI;
                    const distance = 50 + Math.random() * 80;
                    star.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                    star.style.setProperty('--ty', Math.sin(angle) * distance - 30 + 'px');
                    document.body.appendChild(star);
                    star.addEventListener('animationend', () => star.remove());
                }
            }

            function getClickPos(e) {
                return { x: e.clientX || e.touches?.[0]?.clientX || window.innerWidth/2, y: e.clientY || e.touches?.[0]?.clientY || window.innerHeight/2 };
            }

            // === Render Functions ===
            function renderCategorySelection() {
                container.innerHTML = '';
                const musicBtn = document.createElement('button');
                musicBtn.className = 'music-toggle';
                musicBtn.id = 'musicToggle';
                musicBtn.textContent = musicEnabled ? '🎵' : '🔇';
                musicBtn.addEventListener('click', toggleMusic);
                container.appendChild(musicBtn);

                const title = document.createElement('h2');
                title.textContent = 'اختر فئة الأسئلة';
                container.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'categories-grid';
                Object.keys(allQuestions).forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'category-btn';
                    btn.textContent = cat;
                    btn.addEventListener('click', () => startCategory(cat));
                    grid.appendChild(btn);
                });
                container.appendChild(grid);
            }

            function startCategory(catName) {
                currentCategory = catName;
                questions = allQuestions[catName] || [];
                currentIndex = 0;
                if (questions.length === 0) {
                    alert('لا توجد أسئلة في هذه الفئة');
                    renderCategorySelection();
                    return;
                }
                renderQuestion();
            }

            function renderQuestion() {
                if (questions.length === 0 || currentIndex >= questions.length) {
                    showCompletion();
                    return;
                }
                container.innerHTML = '';

                // Music toggle
                const musicBtn = document.createElement('button');
                musicBtn.className = 'music-toggle';
                musicBtn.id = 'musicToggle';
                musicBtn.textContent = musicEnabled ? '🎵' : '🔇';
                musicBtn.addEventListener('click', toggleMusic);
                container.appendChild(musicBtn);

                // Category label
                const catLabel = document.createElement('div');
                catLabel.className = 'category-label';
                catLabel.textContent = currentCategory;
                container.appendChild(catLabel);

                // Progress
                const progress = document.createElement('div');
                progress.className = 'progress';
                progress.textContent = `السؤال ${currentIndex + 1} من ${questions.length}`;
                container.appendChild(progress);

                // Hint button if hint exists
                const q = questions[currentIndex];
                if (q.hint && q.hint.trim() !== '') {
                    const hintBtn = document.createElement('button');
                    hintBtn.className = 'hint-btn';
                    hintBtn.textContent = '💡 تلميح';
                    hintBtn.addEventListener('click', () => {
                        const hintText = document.getElementById('hintText');
                        if (hintText) {
                            hintText.style.display = hintText.style.display === 'none' ? 'block' : 'none';
                        }
                    });
                    container.appendChild(hintBtn);

                    const hintDiv = document.createElement('div');
                    hintDiv.id = 'hintText';
                    hintDiv.style.display = 'none';
                    hintDiv.style.background = '#fffde7';
                    hintDiv.style.padding = '10px';
                    hintDiv.style.borderRadius = '15px';
                    hintDiv.style.marginBottom = '15px';
                    hintDiv.style.color = '#5d4037';
                    hintDiv.textContent = q.hint;
                    container.appendChild(hintDiv);
                }

                // Question text
                const qBox = document.createElement('div');
                qBox.className = 'question-box';
                qBox.textContent = q.question;
                container.appendChild(qBox);

                // Options
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt.text;
                    btn.addEventListener('click', (e) => handleAnswer(idx, btn, e));
                    optionsDiv.appendChild(btn);
                });
                container.appendChild(optionsDiv);

                // Explanation box (hidden)
                const explBox = document.createElement('div');
                explBox.className = 'explanation-box';
                explBox.id = 'explanationBox';
                container.appendChild(explBox);

                // Back button
                const backBtn = document.createElement('button');
                backBtn.className = 'back-btn';
                backBtn.textContent = '🔙 العودة للفئات';
                backBtn.addEventListener('click', () => {
                    currentCategory = null;
                    questions = [];
                    currentIndex = 0;
                    renderCategorySelection();
                });
                container.appendChild(backBtn);

                container.dataset.locked = 'false';
            }

            function disableOptions(disable) {
                const allBtns = container.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = disable);
            }

            function handleAnswer(selectedIdx, btnElement, event) {
                if (container.dataset.locked === 'true') return;
                container.dataset.locked = 'true';
                const q = questions[currentIndex];
                const selectedOption = q.options[selectedIdx];
                const isCorrect = selectedOption.is_correct;
                const pos = getClickPos(event);

                initAudioContext();

                // Visual feedback on button
                btnElement.classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');
                container.classList.add(isCorrect ? 'correct-bg' : 'wrong-bg');
                if (isCorrect) {
                    playCorrectSound();
                    spawnStars(pos.x, pos.y, 15);
                } else {
                    playWrongSound();
                }

                // Show explanation
                const explBox = document.getElementById('explanationBox');
                if (explBox && selectedOption.explanation) {
                    explBox.textContent = selectedOption.explanation;
                    explBox.style.display = 'block';
                } else if (explBox) {
                    explBox.style.display = 'none';
                }

                disableOptions(true);

                if (isCorrect) {
                    // Move to next question after delay
                    setTimeout(() => {
                        btnElement.classList.remove('correct-flash');
                        container.classList.remove('correct-bg');
                        if (explBox) explBox.style.display = 'none';
                        currentIndex++;
                        container.dataset.locked = 'false';
                        renderQuestion();
                    }, 2000);
                } else {
                    // Allow retry
                    setTimeout(() => {
                        btnElement.classList.remove('wrong-flash');
                        container.classList.remove('wrong-bg');
                        if (explBox) explBox.style.display = 'none';
                        container.dataset.locked = 'false';
                        disableOptions(false);
                    }, 1500);
                }
            }

            function showCompletion() {
                container.innerHTML = '';
                const musicBtn = document.createElement('button');
                musicBtn.className = 'music-toggle';
                musicBtn.id = 'musicToggle';
                musicBtn.textContent = musicEnabled ? '🎵' : '🔇';
                musicBtn.addEventListener('click', toggleMusic);
                container.appendChild(musicBtn);

                const msg = document.createElement('div');
                msg.className = 'completion-msg';
                msg.textContent = `🎉 أنهيت فئة "${currentCategory}"`;
                container.appendChild(msg);

                const stars = document.createElement('div');
                stars.className = 'finish-stars';
                stars.textContent = '🌟🌟🌟🌟🌟';
                container.appendChild(stars);

                const actions = document.createElement('div');
                actions.style.marginTop = '20px';
                const backBtn = document.createElement('button');
                backBtn.className = 'back-btn';
                backBtn.textContent = '🔙 العودة للفئات';
                backBtn.addEventListener('click', () => {
                    currentCategory = null;
                    questions = [];
                    currentIndex = 0;
                    renderCategorySelection();
                });
                actions.appendChild(backBtn);
                const againBtn = document.createElement('button');
                againBtn.className = 'reset-btn';
                againBtn.textContent = '🔄 إعادة هذه الفئة';
                againBtn.addEventListener('click', () => { currentIndex = 0; renderQuestion(); });
                actions.appendChild(againBtn);
                container.appendChild(actions);
            }

            // === JSON Loading ===
            async function loadQuestions() {
                try {
                    const res = await fetch('./questions.json');
                    if (!res.ok) throw new Error('تعذر تحميل الملف');
                    const data = await res.json();
                    if (typeof data !== 'object' || Array.isArray(data)) throw new Error('يجب أن يكون الملف كائناً بمفاتيح الفئات');
                    for (const [cat, arr] of Object.entries(data)) {
                        if (!Array.isArray(arr)) throw new Error(`الفئة ${cat} ليست مصفوفة`);
                        arr.forEach((q, i) => {
                            if (!q.question || !Array.isArray(q.options) || q.options.length < 2) throw new Error(`السؤال ${i+1} في ${cat} غير مكتمل`);
                            q.options.forEach((opt, j) => {
                                if (!opt.text || typeof opt.is_correct !== 'boolean') throw new Error(`الخيار ${j+1} في السؤال ${i+1} (${cat}) ينقصه حقل نصي أو is_correct`);
                            });
                        });
                    }
                    allQuestions = data;
                    renderCategorySelection();
                } catch (err) {
                    container.innerHTML = `<h2 style="color:red;">⚠️ ${err.message}</h2>`;
                    console.error(err);
                }
            }

            document.body.addEventListener('click', initAudioContext, { once: true });
            document.body.addEventListener('touchstart', initAudioContext, { once: true });

            loadQuestions();

            // Expose toggleMusic globally for dynamic buttons
            window.toggleMusic = toggleMusic;
        })();
    </script>
</body>
</html>
